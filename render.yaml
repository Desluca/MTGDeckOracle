services:
  - type: web
    name: mtg-deck-oracle
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: POSTGRES_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mtg-deck-oracle-db
          property: connectionString

databases:
  - name: mtg-deck-oracle-db
    plan: free
